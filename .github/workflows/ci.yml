name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # apt's Ruby, not ruby/setup-ruby's: apt's ruby-gtk4 is built for apt's Ruby, and the
    # project uses no other (AGENTS.md, Conventions). Ubuntu 26.04 ships Ruby 3.3.
    container: ubuntu:26.04
    env:
      BUNDLE_PATH: vendor/bundle
      # The bare image has no locale, so Ruby would read our UTF-8 sources as US-ASCII.
      LANG: C.UTF-8
      DEBIAN_FRONTEND: noninteractive
    steps:
      # git before checkout, or checkout falls back to a tarball and `git diff` has no repo.
      # ruby-dev and build-essential compile the bundle's C extensions (prism, redcarpet, …).
      # libgtk-4-bin brings gtk4-broadwayd, the display the GTK specs start for themselves.
      # The install spec runs a private session bus, gapplication, gsettings over GNOME's
      # keybinding schemas, and desktop-file-validate.
      # ripgrep backs pikuri-workspace's glob tool, which the [documents] specs configure.
      # gir1.2-shumate-1.0 is the map under a place answer; its specs draw a local tile server's.
      # rhythmbox and libgtk-3-bin's broadwayd run the real, headless Rhythmbox play_music's spec
      # drives; without them that spec skips. rhythmbox-plugins, only a Recommends, carries the
      # dbus-media-server and MPRIS plugins that spec talks to.
      - name: Install the apt stack
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ruby ruby-bundler ruby-dev build-essential \
            ruby-gtk4 gir1.2-adw-1 gir1.2-shumate-1.0 libgtk-4-bin ripgrep \
            rhythmbox rhythmbox-plugins libgtk-3-bin \
            dbus-daemon libglib2.0-bin desktop-file-utils \
            gsettings-desktop-schemas gnome-settings-daemon-common \
            git ca-certificates
      - uses: actions/checkout@v7
      # The container runs as root over a checkout the runner's user owns.
      - name: Let git trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: bundle-ubuntu-26.04-${{ hashFiles('Gemfile.lock') }}
      - run: bundle install --jobs 4 --retry 3
      - run: bundle exec rake
      - name: Fail if sig/ is out of date
        run: git diff --exit-code sig/
