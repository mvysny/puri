; The test box's llama.cpp router presets, one per model Runner::CONFIGURATIONS names, each at its
; model card's sampling; a configuration sends what its mode changes. On the box:
;
;   llama-server --models-preset presets.ini --host 0.0.0.0
;
; Box#only unloads the other presets itself. Off a trusted network, add --api-key-file as the
; models page's home server does. The first load of a preset downloads it, about 47 GB in all:
; load each once before a timed run.
version = 1

[*]
; every layer on the GPU
n-gpu-layers = 999
; Puri's own context
c = 65536
; one slot, so no two requests share the timings
parallel = 1
; the tasks are text: no projector, so the memory is the model's own
no-mmproj = true
; Box#metrics reads the tokens a second from /metrics?model=…
metrics = true
load-on-startup = false

[Ornith-1.5]
hf-repo = ornith-ai/Ornith-1.5-35B-A3B-GGUF:Q4_K_M
temp = 0.6
top-p = 0.95
top-k = 20

[Nemotron-3.5-Bolt-E4B]
hf-repo = nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-4GB:Q4_K_M
temp = 1.0
top-p = 0.95

[Qwen3.5-4B]
hf-repo = ggml-org/Qwen3.5-4B-GGUF:Q4_K_M
; the card's thinking-off values; the thinking configuration sends its own. The card asks for
; 128K or more when thinking; every preset gets Puri's 64K.
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0.0
presence-penalty = 1.5

[Granite-4.2-3B]
hf-repo = ibm-granite/granite-4.2-3b-GGUF:Q4_K_M
temp = 1.0
top-p = 0.95

; needs llama.cpp b11960 or newer
[LFM3-1.7B]
hf-repo = LiquidAI/LFM3-1.7B-GGUF:Q8_0
temp = 0.1
top-k = 50
repeat-penalty = 1.1

; MXFP4; the sampling is OpenAI's guidance, not on the card
[gpt-oss-20b]
hf-repo = ggml-org/gpt-oss-20b-GGUF
temp = 1.0
top-p = 1.0
